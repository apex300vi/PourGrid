// ── VENUE CORRECTION FACTORS ────────────────────────────────────────────────
// Products Paradise Pie draws from Sapphire order (~33% of Sapphire volume)
var PARADISE_PRODS=["Bacardi Superior","Bacardi Gold","Bacardi Pineapple","Bacardi Coconut","Captain Morgan Spiced Rum","Cruzan Vanilla","Blue Curacao","Amaretto","Aperol","Lunetta Prosecco","Twisted Tea cans","White Claw - Black Cherry","Surfside Lemonade","Soca cans","Beach Life cans","Reef Life cans","Carib cans","Heineken cans","Miller Lite cans","Coors Light cans","Bud Light Cans","Corona cans","Mich Ultra cans","Pina Colada Island Oasis","Mango Island Oasis","Guava Island Oasis","Pineapple Juice","Orange Juice","Fruit Punch","Coco Lopez","Lime Juice"];
// Beach Buzz estimated weekly bottle draws
var BEACH_BUZZ_WEEKLY={"Stoli Vodka":4,"Jameson Irish Whiskey":3,"Irish Cream":3,"Myers's Dark Rum":2,"Sabroso Coffee Liqueur":3,"Crème de Cacao":3,"Amaretto":2};
// Seasalt occasional structural draws (extra buffer)
var SEASALT_BUFFER={"Tanqueray Gin":2,"Lunazul Blanco":2,"Lunazul Reposado":1,"Bacardi Superior":2,"Stoli Vodka":2};

function getVenueCorrection(productName, baseConsumed){
  var total=baseConsumed;
  // Paradise Pie: ~33% additional consumption for applicable products
  if(PARADISE_PRODS.indexOf(productName)>=0){
    total+=baseConsumed*0.33;
  }
  // Beach Buzz: fixed weekly draw
  if(BEACH_BUZZ_WEEKLY[productName]){
    total+=BEACH_BUZZ_WEEKLY[productName];
  }
  // Seasalt: occasional buffer
  if(SEASALT_BUFFER[productName]){
    total+=SEASALT_BUFFER[productName]*0.5; // 50% probability they drew it
  }
  return Math.round(total*10)/10;
}


function getStoliFreeBottleSuggestion(counts, stolicasesOrdered){
  if(!stolicasesOrdered||stolicasesOrdered<1)return null;
  var freeBottles=stolicasesOrdered*3;
  // Check stock levels of Oranj, Raz, Blu
  var flavors=[
    {name:"Stoli Oranj",count:Number(counts["Stoli Oranj"]||0)},
    {name:"Stoli Raz",count:Number(counts["Stoli Raz"]||0)},
    {name:"Stoli Blu",count:Number(counts["Stoli Blu"]||0)},
  ];
  // Sort by stock ascending - suggest lowest first
  flavors.sort(function(a,b){return a.count-b.count;});
  // Distribute free bottles to lowest stock flavors
  var suggestions=[];
  var remaining=freeBottles;
  flavors.forEach(function(f){
    if(remaining<=0)return;
    var give=Math.min(remaining,3); // max 3 per flavor
    suggestions.push({name:f.name,qty:give,currentStock:f.count});
    remaining-=give;
  });
  return {freeBottles:freeBottles,suggestions:suggestions};
}


// ── MULTI-PHOTO CASE + BOTTLE COUNTING ──────────────────────────────────────
// Replaces the old single-shot AI vision approach (which required a live
// server-side API key and cannot work from a static page). This version:
//  1. Lets you attach any number of reference photos of the room/shelves
