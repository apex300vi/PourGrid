name: PR57 authenticated preview
on:
  push:
    branches: [fix/history-profit-seasonal-v2]
jobs:
  authenticated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify exact deployed preview with isolated tenant
        env:
          PG_E2E_URL: https://deploy-preview-57--pourgrid.netlify.app/
          PG_E2E_EMAIL: ${{ secrets.PG_PR57_E2E_EMAIL }}
          PG_E2E_PASSWORD: ${{ secrets.PG_PR57_E2E_PASSWORD }}
        run: node test/pr57-preview.e2e.cjs
