name: Phase 3 database verification
on:
  push:
    branches: [agent/phase3-receiving-inventory-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: phase3test
          POSTGRES_DB: pourgrid_phase3
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d pourgrid_phase3"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: pourgrid_phase3
      PGUSER: postgres
      PGPASSWORD: phase3test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build client
        run: npm ci && npm run build
      - name: Bootstrap confirmed legacy shape
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Run migration preflight
        run: psql -v ON_ERROR_STOP=1 -f scripts/phase3-preflight.sql
      - name: Apply Phase 3 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608070001_phase3_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608070002_phase3_operations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608070003_phase3_security_and_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608100004_bar_lead_role.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608100005_bar_lead_access.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110001_bar_lead_history.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110002_profit_lab.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110003_profit_lab_ingredient_costing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110004_profit_lab_verified_supplier_values.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110005_profit_lab_complete_workflow.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110006_required_password_change.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110007_required_password_change_pgcrypto.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608110008_manager_temporary_onboarding.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608120001_profit_lab_current_menu_v12.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608120002_profit_lab_revision_current_menu_action.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608120003_password_change_completion_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608180001_transactional_order_save.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608220001_history_analytics_seasonal_profiles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608220002_history_location_attribution.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230001_history_v2_ambiguity_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230002_seasonal_list_order_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230003_transactional_history_attribution_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230004_shared_location_drafts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230005_shared_draft_empty_reader_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608230006_shared_draft_realtime_read_policy.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608240001_seasonal_profile_manager.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608250001_profit_lab_bib_finished_yield.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608250002_profit_lab_bib_finished_yield_deploy_repair.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608250003_bib_package_size_identity_correction.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608250004_cranberry_bib_verified_cost.sql
      - name: Run executable database and RLS suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/phase3_executable.sql
      - name: Verify Seasonal Profile activation, isolation, and draft pinning
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/seasonal_profile_manager.sql
      - name: Verify BIB finished-yield costing and virtual Club Soda
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/profit_lab_bib_finished_yield.sql
      - name: Verify anonymous direct access is denied
        shell: bash
        run: |
          if psql -v ON_ERROR_STOP=1 -c "set role anon; select * from public.structured_orders"; then
            echo "anonymous direct read unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Verify concurrent finalization is exactly once
        shell: bash
        run: |
          call="set role authenticated; select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000003',false); select public.finalize_receiving('72000000-0000-0000-0000-000000000004');"
          psql -v ON_ERROR_STOP=1 -c "$call" & a=$!
          psql -v ON_ERROR_STOP=1 -c "$call" & b=$!
          wait "$a"; wait "$b"
          test "$(psql -Atc "select count(*) from public.inventory_movements where source_id='73000000-0000-0000-0000-000000000004'")" = "1"
          test "$(psql -Atc "select received_units from public.order_lines where id='71000000-0000-0000-0000-000000000003'")" = "1"
      - name: Run post-migration verification
        run: psql -v ON_ERROR_STOP=1 -f scripts/phase3-verify.sql
      - name: Run JavaScript regression suite
        run: node --test test/*.test.js
