name: PR58 authenticated preview
on:
  push:
    branches: [feature/seasonal-profiles-focused]
jobs:
  seasonal-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed seasonal preview with isolated tenant
        env:
          PG_E2E_URL: https://deploy-preview-58--pourgrid.netlify.app/
          PG_E2E_EMAIL: ${{ secrets.PG_PR58_E2E_EMAIL }}
          PG_E2E_PASSWORD: ${{ secrets.PG_PR58_E2E_PASSWORD }}
          PG_TARGET_ORG: ${{ secrets.PG_PR58_TARGET_ORG }}
          PG_TARGET_LOCATION: ${{ secrets.PG_PR58_TARGET_LOCATION }}
        run: node test/pr58-preview.e2e.cjs
